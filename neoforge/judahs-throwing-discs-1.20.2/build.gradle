plugins { id 'java-library'; id 'net.neoforged.gradle.userdev' version '7.0.116' }
version = '1.4.1+1.20.2'
group = 'dev.disc'
base.archivesName = 'judahs-throwing-discs-neoforge-mc1.20.2'
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
sourceSets.main.java.srcDir 'src/client/java'
repositories { mavenCentral(); maven { url = 'https://maven.neoforged.net/releases' } }
dependencies { implementation 'net.neoforged:neoforge:20.2.93' }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
jar { from('LICENSE'); manifest.attributes('MixinConfigs': 'throwing_disc.mixins.json') }
