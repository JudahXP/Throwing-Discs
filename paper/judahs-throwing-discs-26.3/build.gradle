plugins { id 'java' }
version = '1.4.1-paper-dev'
group = 'dev.disc'
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:26.3.build.263-stable' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
