plugins { id 'java'; id 'net.minecraftforge.gradle' version '7.0.29' }
version = '1.4.1+26.3'
group = 'dev.disc'
base.archivesName = 'judahs-throwing-discs-forge-mc26.3'
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
sourceSets.main.java.srcDir 'src/client/java'
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies { implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.9') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
jar { manifest.attributes('MixinConfigs': 'throwing_disc.mixins.json'); from('LICENSE') }

// Forge ships Mixin 0.8.7: keep mixin bytecode within its supported compatibility level.
sourceSets.main.java.exclude 'dev/disc/mixin/**'
def forgeMixins = tasks.register('compileForgeMixins', JavaCompile) {
    source = fileTree('src/main/java') { include 'dev/disc/mixin/**/*.java' }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output.classesDirs
    destinationDirectory = layout.buildDirectory.dir('classes/java/forgeMixins')
    options.release = 21
    dependsOn tasks.named('compileJava')
}
tasks.named('jar') { from(forgeMixins) }
